services:
  vllm:
    image: ${INKLING_VLLM_IMAGE}
    pull_policy: never
    entrypoint: []
    network_mode: host
    ipc: host
    shm_size: "64gb"
    # Preserve the host control plane if a unified-memory experiment oversubscribes RAM.
    oom_score_adj: ${OOM_SCORE_ADJ:-500}

    ulimits:
      memlock: -1
      stack: 67108864

    gpus: all

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${MODEL_ROOT}:/models:ro
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/cache/huggingface
      - ${INKLING_MEDIA_DIR:-${HOME}/runtime/inkling-small-nvfp4-spark/media}:/media:ro

    environment:
      HF_HOME: /cache/huggingface
      TRITON_CACHE_DIR: /cache/huggingface/triton_cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      FLASH_ATTENTION_CUTE_DSL_CACHE_ENABLED: "1"
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      CUTE_DSL_ARCH: "sm_121a"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      LAMPORT_RS_SCONV: "0"
      INKLING_MODEL: ${INKLING_MODEL}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME}
      PARALLEL_MODE: ${PARALLEL_MODE:-tp_pp}
      TENSOR_PARALLEL_SIZE: ${TENSOR_PARALLEL_SIZE:-2}
      PIPELINE_PARALLEL_SIZE: ${PIPELINE_PARALLEL_SIZE:-1}
      DATA_PARALLEL_SIZE: ${DATA_PARALLEL_SIZE:-1}
      DATA_PARALLEL_SIZE_LOCAL: ${DATA_PARALLEL_SIZE_LOCAL:-1}
      VLLM_HOST: ${VLLM_HOST}
      VLLM_PORT: ${VLLM_PORT}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS}
      BLOCK_SIZE: ${BLOCK_SIZE:-16}
      ENABLE_PREFIX_CACHING: ${ENABLE_PREFIX_CACHING:-1}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION}
      KV_CACHE_DTYPE: ${KV_CACHE_DTYPE}
      MTP_NUM_TOKENS: ${MTP_NUM_TOKENS}
      KV_CACHE_MEMORY_BYTES: ${KV_CACHE_MEMORY_BYTES:-}
      MOE_BACKEND: ${MOE_BACKEND:-auto}
      INKLING_TIMING: ${INKLING_TIMING:-0}
      INKLING_DECOMP: ${INKLING_DECOMP:-0}
      INKLING_MOE_SPLIT: ${INKLING_MOE_SPLIT:-0}
      INKLING_PROFILE: ${INKLING_PROFILE:-0}
      INKLING_SINK_FP8: ${INKLING_SINK_FP8:-1}
      INKLING_SINK_NVFP4: ${INKLING_SINK_NVFP4:-1}
      INKLING_TIMING_FLUSH: ${INKLING_TIMING_FLUSH:-4000}
      ENABLE_EXPERT_PARALLEL: ${ENABLE_EXPERT_PARALLEL:-0}
      ENABLE_EP_WEIGHT_FILTER: ${ENABLE_EP_WEIGHT_FILTER:-0}
      ALL2ALL_BACKEND: ${ALL2ALL_BACKEND:-allgather_reducescatter}
      VLLM_HOST_IP: ${VLLM_HOST_IP}
      NODE_IP: ${VLLM_HOST_IP}
      NODE_RANK: ${NODE_RANK}
      HEADLESS: ${HEADLESS:-}
      MASTER_ADDR: ${MASTER_ADDR}
      MASTER_PORT: ${MASTER_PORT}
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: ${NCCL_IB_HCA}
      NCCL_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME}
      TP_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME}
      GLOO_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME}
      NCCL_IB_GID_INDEX: ${NCCL_IB_GID_INDEX}
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_NVLS_ENABLE: "0"
      NCCL_DEBUG: WARN

    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        spec_args=()
        if [ "$${MTP_NUM_TOKENS:-0}" -gt 0 ]; then
          spec_args=(--speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":$${MTP_NUM_TOKENS}}")
        fi
        memory_args=(--kv-cache-dtype "$${KV_CACHE_DTYPE}" --gpu-memory-utilization "$${GPU_MEMORY_UTILIZATION}")
        if [ -n "$${KV_CACHE_MEMORY_BYTES:-}" ]; then
          memory_args+=(--kv-cache-memory-bytes "$${KV_CACHE_MEMORY_BYTES}")
        fi
        parallel_args=(
          --tensor-parallel-size "$${TENSOR_PARALLEL_SIZE}"
          --pipeline-parallel-size "$${PIPELINE_PARALLEL_SIZE}"
          --distributed-executor-backend mp
          --nnodes 2
          --node-rank "$${NODE_RANK}"
          --master-addr "$${MASTER_ADDR}"
          --master-port "$${MASTER_PORT}"
        )
        if [ "$${PARALLEL_MODE:-tp_pp}" = "dp_ep" ]; then
          parallel_args=(
            --tensor-parallel-size 1
            --pipeline-parallel-size 1
            --data-parallel-size "$${DATA_PARALLEL_SIZE}"
            --data-parallel-size-local "$${DATA_PARALLEL_SIZE_LOCAL}"
            --data-parallel-start-rank "$${NODE_RANK}"
            --data-parallel-address "$${MASTER_ADDR}"
            --data-parallel-rpc-port "$${MASTER_PORT}"
          )
        fi
        ep_args=()
        if [ "$${ENABLE_EXPERT_PARALLEL:-0}" -gt 0 ]; then
          ep_args=(--enable-expert-parallel --all2all-backend "$${ALL2ALL_BACKEND}")
          if [ "$${ENABLE_EP_WEIGHT_FILTER:-0}" -gt 0 ]; then
            ep_args+=(--enable-ep-weight-filter)
          fi
        fi
        prefix_args=()
        if [ "$${ENABLE_PREFIX_CACHING:-1}" -gt 0 ]; then
          prefix_args=(--enable-prefix-caching)
        else
          prefix_args=(--no-enable-prefix-caching)
        fi
        headless_args=()
        if [ -n "$${HEADLESS:-}" ]; then
          headless_args=(--headless)
        fi
        exec vllm serve "$${INKLING_MODEL}" \
          --served-model-name "$${SERVED_MODEL_NAME}" \
          --host "$${VLLM_HOST}" \
          --port "$${VLLM_PORT}" \
          --trust-remote-code \
          "$${parallel_args[@]}" \
          --max-model-len "$${MAX_MODEL_LEN}" \
          --max-num-seqs "$${MAX_NUM_SEQS}" \
          --max-num-batched-tokens "$${MAX_NUM_BATCHED_TOKENS}" \
          --block-size "$${BLOCK_SIZE}" \
          "$${memory_args[@]}" \
          --tokenizer-mode inkling \
          --reasoning-parser inkling \
          --tool-call-parser inkling \
          --enable-auto-tool-choice \
          "$${prefix_args[@]}" \
          --enable-chunked-prefill \
          --async-scheduling \
          --enable-prompt-tokens-details \
          --generation-config vllm \
          --moe-backend "$${MOE_BACKEND}" \
          --compilation-config '{"cudagraph_capture_sizes":[1,2,3,4,8,16,32,40,48]}' \
          --kernel-config.enable_flashinfer_autotune=True \
          --limit-mm-per-prompt '{"image":16,"audio":4}' \
          --allowed-local-media-path /media \
          "$${ep_args[@]}" \
          "$${spec_args[@]}" \
          "$${headless_args[@]}"
